<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>音声ファイル</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #121212;
    color: #fff;

    padding-bottom: 110px;
    overflow-x: hidden;
}

/* =========================
   ヘッダー
========================= */

header {
    padding: 28px 32px 20px;
    background: #121212;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 6px 0 0;
    color: #aaa;
    font-size: 13px;
}

/* =========================
   メイン
========================= */

main {
    width: 100%;
    max-width: 1000px;
    margin: auto;
    padding: 0 24px 30px;
}

/* =========================
   検索
========================= */

.search {
    width: 100%;
    height: 46px;

    border: 0;
    border-radius: 24px;

    padding: 0 18px;

    background: #242424;
    color: #fff;

    font-size: 15px;
    outline: none;
}

.search::placeholder {
    color: #888;
}

.search:focus {
    background: #2c2c2c;
}

/* =========================
   ステータス
========================= */

.status {
    margin: 20px 4px 12px;
    color: #999;
    font-size: 13px;
}

/* =========================
   曲一覧
========================= */

.song {
    display: flex;
    align-items: center;
    gap: 14px;

    width: 100%;
    min-width: 0;

    padding: 12px 14px;
    margin-bottom: 4px;

    border-radius: 8px;

    cursor: pointer;
    transition: background .15s;
}

.song:hover {
    background: #242424;
}

.song-number {
    width: 28px;
    flex-shrink: 0;

    text-align: center;
    color: #888;
    font-size: 14px;
}

.song-info {
    flex: 1;
    min-width: 0;
}

.song-title {
    font-size: 15px;
    line-height: 1.4;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.song-size {
    margin-top: 3px;
    color: #777;
    font-size: 11px;
}

.play-button {
    width: 38px;
    height: 38px;

    flex-shrink: 0;

    border: 0;
    border-radius: 50%;

    background: #fff;
    color: #111;

    font-size: 16px;
    cursor: pointer;
}

.play-button:hover {
    transform: scale(1.04);
}

.download {
    flex-shrink: 0;

    color: #aaa;
    text-decoration: none;

    font-size: 13px;
}

.download:hover {
    color: #fff;
}

/* =========================
   空表示
========================= */

.empty {
    padding: 60px 20px;
    text-align: center;
    color: #777;
}

/* =========================
   プレイヤー
========================= */

.player {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 1000;

    height: 92px;

    background: #181818;
    border-top: 1px solid #303030;

    display: grid;

    grid-template-columns:
        minmax(150px, 1fr)
        minmax(300px, 2fr)
        minmax(150px, 1fr);

    align-items: center;

    padding: 10px 24px;
}

/* 曲情報 */

.now-playing {
    min-width: 0;
}

.now-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    font-size: 14px;
    font-weight: 600;
}

.now-sub {
    margin-top: 4px;
    color: #888;
    font-size: 11px;
}

/* 中央操作 */

.controls {
    width: 100%;
    max-width: 600px;
    margin: auto;
}

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.control {
    border: 0;
    background: transparent;
    color: #ddd;

    cursor: pointer;
    font-size: 17px;
}

.control:hover {
    color: #fff;
}

.main-play {
    width: 36px;
    height: 36px;

    border: 0;
    border-radius: 50%;

    background: #fff;
    color: #111;

    cursor: pointer;
    font-size: 15px;
}

.progress-row {
    display: flex;
    align-items: center;
    gap: 8px;

    margin-top: 8px;
}

.time {
    width: 35px;

    color: #888;
    font-size: 10px;

    text-align: center;
}

.progress {
    flex: 1;

    height: 4px;

    accent-color: #fff;
    cursor: pointer;
}

/* 音量 */

.volume {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
}

.volume-slider {
    width: 100px;
    accent-color: #fff;
}

/* 実際のaudioは非表示 */

audio {
    display: none;
}

/* =========================
   スマホ
========================= */

@media (max-width: 700px) {

    body {
        padding-bottom: 145px;
    }

    header {
        padding: 22px 16px 16px;
    }

    header h1 {
        font-size: 23px;
    }

    main {
        padding: 0 12px 20px;
    }

    .search {
        height: 44px;
    }

    .song {
        padding: 11px 8px;
        gap: 8px;
    }

    .song-number {
        width: 22px;
    }

    .song-title {
        font-size: 14px;
    }

    .download {
        display: none;
    }

    /* スマホではプレイヤーを縦型に */

    .player {
        height: 135px;

        display: block;

        padding: 10px 14px;
    }

    .now-playing {
        text-align: center;
    }

    .now-title {
        font-size: 13px;
    }

    .now-sub {
        display: none;
    }

    .controls {
        max-width: none;
    }

    .buttons {
        margin-top: 7px;
        gap: 24px;
    }

    .progress-row {
        margin-top: 7px;
    }

    .volume {
        display: none;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎵 音声ファイル</h1>
    <p>My Audio Library</p>
</header>

<main>

    <input
        id="search"
        class="search"
        type="search"
        placeholder="曲名を検索..."
    >

    <div id="status" class="status">
        読み込み中...
    </div>

    <div id="songs"></div>

</main>

<!-- =========================
     プレイヤー
========================= -->

<div class="player">

    <div class="now-playing">
        <div id="nowTitle" class="now-title">
            曲を選択してください
        </div>

        <div class="now-sub">
            My Audio Library
        </div>
    </div>

    <div class="controls">

        <div class="buttons">

            <button
                id="prev"
                class="control"
                title="前の曲"
            >⏮</button>

            <button
                id="play"
                class="main-play"
                title="再生"
            >▶</button>

            <button
                id="next"
                class="control"
                title="次の曲"
            >⏭</button>

        </div>

        <div class="progress-row">

            <span id="currentTime" class="time">
                0:00
            </span>

            <input
                id="progress"
                class="progress"
                type="range"
                min="0"
                max="100"
                value="0"
            >

            <span id="duration" class="time">
                0:00
            </span>

        </div>

    </div>

    <div class="volume">

        🔊

        <input
            id="volume"
            class="volume-slider"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1"
        >

    </div>

</div>

<audio id="audio" preload="metadata"></audio>

<script>

const OWNER = "aoaoaoreinn-a11y";
const REPO = "yt";
const RELEASE_TAG = "audio";

const API_URL =
    `https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/${RELEASE_TAG}`;

let songs = [];
let currentIndex = -1;

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("play");

const progress =
    document.getElementById("progress");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const nowTitle =
    document.getElementById("nowTitle");


/* =========================
   GitHubから取得
========================= */

async function loadSongs() {

    const status =
        document.getElementById("status");

    try {

        const response =
            await fetch(API_URL);

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const release =
            await response.json();

        songs =
            release.assets
                .filter(asset =>
                    asset.name
                        .toLowerCase()
                        .endsWith(".opus")
                )
                .map(asset => ({
                    name: asset.name,
                    title: asset.label || asset.name,
                    url: asset.browser_download_url,
                    size: asset.size
                }));

        renderSongs();

    } catch (error) {

        console.error(error);

        status.textContent =
            "音声ファイルを取得できませんでした。";
    }
}


/* =========================
   一覧表示
========================= */

function renderSongs() {

    const container =
        document.getElementById("songs");

    const status =
        document.getElementById("status");

    const keyword =
        document
            .getElementById("search")
            .value
            .toLowerCase();

    container.innerHTML = "";

    const filtered =
        songs.filter(song =>
            song.title
                .toLowerCase()
                .includes(keyword)
        );

    status.textContent =
        `${filtered.length}曲`;

    if (!filtered.length) {

        container.innerHTML = `
            <div class="empty">
                曲が見つかりません。
            </div>
        `;

        return;
    }

    filtered.forEach((song, index) => {

        const realIndex =
            songs.indexOf(song);

        const element =
            document.createElement("div");

        element.className = "song";

        element.innerHTML = `
            <div class="song-number">
                ${index + 1}
            </div>

            <div class="song-info">
                <div class="song-title">
                    ${escapeHtml(song.title)}
                </div>

                <div class="song-size">
                    ${formatSize(song.size)}
                </div>
            </div>

            <a
                class="download"
                href="${escapeAttribute(song.url)}"
                download
                title="ダウンロード"
                onclick="event.stopPropagation()"
            >
                ↓
            </a>

            <button
                class="play-button"
                title="再生"
                onclick="playSong(${realIndex}); event.stopPropagation();"
            >
                ▶
            </button>
        `;

        element.addEventListener(
            "click",
            () => playSong(realIndex)
        );

        container.appendChild(element);
    });
}


/* =========================
   曲を再生
========================= */

function playSong(index) {

    if (!songs[index]) return;

    currentIndex = index;

    const song =
        songs[index];

    audio.src = song.url;

    nowTitle.textContent =
        song.title;

    audio.play()
        .then(() => {
            playButton.textContent = "Ⅱ";
        })
        .catch(() => {
            playButton.textContent = "▶";
        });
}


/* =========================
   再生 / 一時停止
========================= */

playButton.addEventListener(
    "click",
    () => {

        if (currentIndex === -1) {

            if (songs.length) {
                playSong(0);
            }

            return;
        }

        if (audio.paused) {

            audio.play();

        } else {

            audio.pause();

        }
    }
);

audio.addEventListener(
    "play",
    () => {
        playButton.textContent = "Ⅱ";
    }
);

audio.addEventListener(
    "pause",
    () => {
        playButton.textContent = "▶";
    }
);


/* =========================
   前の曲
========================= */

document
    .getElementById("prev")
    .addEventListener(
        "click",
        () => {

            if (!songs.length) return;

            const index =
                currentIndex <= 0
                    ? songs.length - 1
                    : currentIndex - 1;

            playSong(index);
        }
    );


/* =========================
   次の曲
========================= */

document
    .getElementById("next")
    .addEventListener(
        "click",
        () => {

            if (!songs.length) return;

            const index =
                currentIndex >= songs.length - 1
                    ? 0
                    : currentIndex + 1;

            playSong(index);
        }
    );


/* =========================
   自動で次の曲
========================= */

audio.addEventListener(
    "ended",
    () => {

        if (!songs.length) return;

        const next =
            currentIndex >= songs.length - 1
                ? 0
                : currentIndex + 1;

        playSong(next);
    }
);


/* =========================
   シークバー
========================= */

audio.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(audio.duration);

        progress.value = 0;
    }
);

audio.addEventListener(
    "timeupdate",
    () => {

        if (!audio.duration) return;

        progress.value =
            (audio.currentTime /
                audio.duration) * 100;

        currentTime.textContent =
            formatTime(audio.currentTime);
    }
);

progress.addEventListener(
    "input",
    () => {

        if (!audio.duration) return;

        audio.currentTime =
            (progress.value / 100) *
            audio.duration;
    }
);


/* =========================
   音量
========================= */

document
    .getElementById("volume")
    .addEventListener(
        "input",
        event => {

            audio.volume =
                event.target.value;
        }
    );


/* =========================
   検索
========================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderSongs
    );


/* =========================
   時間
========================= */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "0:00";
    }

    const min =
        Math.floor(seconds / 60);

    const sec =
        Math.floor(seconds % 60)
            .toString()
            .padStart(2, "0");

    return `${min}:${sec}`;
}


/* =========================
   ファイルサイズ
========================= */

function formatSize(bytes) {

    if (bytes < 1024) {
        return `${bytes} B`;
    }

    if (bytes < 1024 * 1024) {
        return `${(bytes / 1024).toFixed(1)} KB`;
    }

    return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
}


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


function escapeAttribute(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}


/* =========================
   起動
========================= */

loadSongs();

</script>

</body>
</html>
