/* =========================================
   GitHub
========================================= */

const OWNER = "aoaoaoreinn-a11y";
const REPO = "yt";
const RELEASE_TAG = "audio";

const API_URL =
    `https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/${RELEASE_TAG}`;


/* =========================================
   GAS
========================================= */

const GAS_URL =
    "https://script.google.com/macros/s/AKfycbyRoupgx5PeSQjOo1XCpCExsvIp4dJ94iN8BriASIOULTUNOMaotXdZ0M1beI5x5TZ_tA/exec";


/* =========================================
   IndexedDB
========================================= */

const DB_NAME = "MyAudioLibrary";
const DB_VERSION = 1;
const STORE_NAME = "audio";

let db = null;


/* =========================================
   保存中の曲
========================================= */

/*
 * 同じ曲を何度もクリックした場合でも、
 * GASへの取得処理を重複させない。
 *
 * Map:
 *   videoId -> Promise
 */

const savingSongs = new Map();


/* =========================================
   IndexedDBを開く
========================================= */

function openDatabase() {

    return new Promise((resolve, reject) => {

        if (!("indexedDB" in window)) {

            reject(
                new Error("IndexedDBが利用できません。")
            );

            return;
        }

        const request =
            indexedDB.open(
                DB_NAME,
                DB_VERSION
            );

        request.onupgradeneeded = event => {

            const database =
                event.target.result;

            if (
                !database.objectStoreNames
                    .contains(STORE_NAME)
            ) {

                database.createObjectStore(
                    STORE_NAME,
                    { keyPath: "name" }
                );
            }
        };

        request.onsuccess = event => {

            db =
                event.target.result;

            db.onversionchange = () => {
                db.close();
            };

            resolve(db);
        };

        request.onerror = () => {

            reject(
                request.error ||
                new Error(
                    "IndexedDBを開けませんでした。"
                )
            );
        };
    });
}


/* =========================================
   IndexedDBから取得
========================================= */

function getCachedAudio(name) {

    return new Promise((resolve, reject) => {

        if (!db) {

            resolve(null);

            return;
        }

        const transaction =
            db.transaction(
                STORE_NAME,
                "readonly"
            );

        const store =
            transaction.objectStore(
                STORE_NAME
            );

        const request =
            store.get(name);

        request.onsuccess = () => {

            const result =
                request.result;

            if (
                !result ||
                !(result.data instanceof Blob)
            ) {

                resolve(null);

                return;
            }

            resolve(result.data);
        };

        request.onerror = () => {

            reject(
                request.error ||
                new Error(
                    "IndexedDB読み込みエラー"
                )
            );
        };
    });
}


/* =========================================
   IndexedDBへ保存
========================================= */

function saveAudio(name, blob) {

    return new Promise((resolve, reject) => {

        if (!db) {

            reject(
                new Error(
                    "IndexedDBが開かれていません。"
                )
            );

            return;
        }

        const transaction =
            db.transaction(
                STORE_NAME,
                "readwrite"
            );

        const store =
            transaction.objectStore(
                STORE_NAME
            );

        const request =
            store.put({
                name: name,
                data: blob,
                savedAt: Date.now()
            });

        request.onsuccess = () => {
            resolve();
        };

        request.onerror = () => {

            reject(
                request.error ||
                new Error(
                    "IndexedDB保存エラー"
                )
            );
        };
    });
}


/* =========================================

let songs = [];

/* =========================================
   GitHubから曲一覧取得
========================================= */

async function loadSongs() {

    const status =
        document.getElementById("status");

    try {

        const response =
            await fetch(API_URL);

        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const release =
            await response.json();

        songs =
            Array.isArray(release.assets)

                ? release.assets
                    .filter(asset =>
                        typeof asset.name === "string" &&
                        asset.name
                            .toLowerCase()
                            .endsWith(".opus")
                    )
                    .map(asset => ({
                        name: asset.name,
                        title:
                            asset.label ||
                            asset.name,
                        id:
                            asset.name
                                .replace(
                                    /\.opus$/i,
                                    ""
                                ),
                        url:
                            asset.browser_download_url,
                        size:
                            asset.size
                    }))

                : [];

        renderSongs();

        status.textContent =
            `${songs.length}曲`;

    } catch (error) {

        console.error(
            "曲一覧の取得に失敗しました:",
            error
        );

        status.textContent =
            "音声ファイルを取得できませんでした。";
    }
}


/* =========================================
   キャッシュ状態取得

async function getCacheStatus(song) {

    try {

        const blob =
            await getCachedAudio(song.name);

        return !!blob;

    } catch (error) {

        console.warn(
            "キャッシュ状態確認失敗:",
            error
        );

        return false;
    }
}

        document.querySelector(
            `[data-song-name="${CSS.escape(song.name)}"]`

    if (!statusElement) {
        return;

    const cached =

    if (cached) {

        statusElement.textContent =
            "✓ オフライン";

        statusElement.className =
            "song-status cached";

        return;
    }

    if (savingSongs.has(song.id)) {

        statusElement.textContent =
            "↓ 保存中...";

        statusElement.className =
            "song-status saving";

        return;
    }

    statusElement.textContent =
        "オンライン";

    statusElement.className =
        "song-status";
}

}


/* =========================================
   Base64 → Blob
========================================= */

function base64ToBlob(
    base64,
    mimeType
) {

    const binary =
        atob(base64);

    const bytes =
        new Uint8Array(
            binary.length
        );

    const chunkSize =
        1024 * 1024;

    for (
        let offset = 0;
        offset < binary.length;
        offset += chunkSize
    ) {

        const end =
            Math.min(
                offset + chunkSize,
                binary.length
            );

        for (
            let i = offset;
            i < end;
            i++
        ) {

            bytes[i] =
                binary.charCodeAt(i);
        }
    }

    return new Blob(
        [bytes],
        {
            type:
                mimeType ||
                "audio/ogg"
        }
    );
}


/* =========================================
   GASから音声を取得
========================================= */

function getAudioFromGAS(videoId) {

    return new Promise(
        (resolve, reject) => {

            const callbackName =
                "__gasAudio_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .slice(2);

            const script =
                document.createElement(
                    "script"
                );

            let finished = false;

            const cleanup = () => {

                if (finished) {
                    return;
                }

                finished = true;

                delete window[
                    callbackName
                ];

                script.remove();
            };

            window[callbackName] =
                data => {

                    if (finished) {
                        return;
                    }

                    cleanup();

                    if (
                        !data ||
                        data.error
                    ) {

                        reject(
                            new Error(
                                data?.error ||
                                "GASから音声データを取得できませんでした。"
                            )
                        );

                        return;
                    }

                    if (!data.data) {

                        reject(
                            new Error(
                                "GASから音声データが返されませんでした。"
                            )
                        );

                        return;
                    }

                    try {

                        const blob =
                            base64ToBlob(
                                data.data,
                                data.mimeType ||
                                "audio/ogg"
                            );

                        resolve({
                            blob: blob,
                            name: data.name,
                            label: data.label
                        });

                    } catch (error) {

                        reject(error);
                    }
                };

            script.onerror = () => {

                cleanup();

                reject(
                    new Error(
                        "GASへの接続に失敗しました。"
                    )
                );
            };

            script.src =
                GAS_URL +
                "?id=" +
                encodeURIComponent(
                    videoId
                ) +
                "&callback=" +
                encodeURIComponent(
                    callbackName
                );

            document.head.appendChild(
                script
            );
        }
    );
}


/* =========================================
   バックグラウンド保存
========================================= */

function saveSongInBackground(song) {

    /*
     * すでに保存済みなら何もしない
     */

    if (savingSongs.has(song.id)) {

        return savingSongs.get(
            song.id
        );
    }


    const promise =
        (async () => {

            try {

                /*
                 * 保存開始
                 */

                console.log(
                    "バックグラウンド保存開始:",
                    song.title
                );

                setSongStatus(
                    song,
                    "↓ 保存中...",
                    "saving"
                );


                /*
                 * GASから取得
                 */

                const result =
                    await getAudioFromGAS(
                        song.id
                    );

                console.log(
                    "GASから取得完了:",
                    song.title
                );


                /*
                 * IndexedDBへ保存
                 */

                await saveAudio(
                    song.name,
                    result.blob
                );

                console.log(
                    "IndexedDBへバックグラウンド保存完了:",
                    song.title
                );


                /*
                 * UI更新
                 */

                setSongStatus(
                    song,
                    "✓ オフライン",
                    "cached"
                );

                return true;

            } catch (error) {

                console.warn(
                    "バックグラウンド保存失敗:",
                    song.title,
                    error
                );

                setSongStatus(
                    song,
                    "オンライン",
                    "error"
                );

                return false;

            } finally {

                savingSongs.delete(
                    song.id
                );
            }

        })();

    savingSongs.set(
        song.id,
        promise
    );

    return promise;
}


/* =========================================
   曲の状態を直接変更
========================================= */

function setSongStatus(
    song,
    text,
    className = ""
) {

    const elements =
        document.querySelectorAll(
            ".song-status"
        );

    elements.forEach(element => {

        if (
            element.dataset.songName ===
            song.name
        ) {

            element.textContent =
                text;

            element.className =
                "song-status " +
                className;
        }
    });
}


/* =========================================
   曲を再生
========================================= */

async function playSong(index) {

    if (!songs[index]) {
        return;
    }

    currentIndex =
        index;

    const song =
        songs[index];

    nowTitle.textContent =
        song.title;

    nowSub.textContent =
        "読み込み中...";

    playButton.textContent =
        "▶";


    /* =====================================
       前のBlob URLを解放
    ===================================== */

    if (currentObjectURL) {

        URL.revokeObjectURL(
            currentObjectURL
        );

        currentObjectURL =
            null;
    }

    audio.pause();


    /* =====================================
       ① IndexedDB確認
    ===================================== */

    let cachedBlob =
        null;

    try {

        cachedBlob =
            await getCachedAudio(
                song.name
            );

    } catch (error) {

        console.warn(
            "IndexedDB読み込み失敗:",
            error
        );
    }


    /* =====================================
       ② IndexedDBに存在
    ===================================== */

    if (cachedBlob) {

        console.log(
            "IndexedDBから再生:",
            song.title
        );

        setSongStatus(
            song,
            "✓ オフライン",
            "cached"
        );

        nowSub.textContent =
            "✓ オフライン再生";

        currentObjectURL =
            URL.createObjectURL(
                cachedBlob
            );

        audio.src =
            currentObjectURL;

        try {

            await audio.play();

        } catch (error) {

            console.error(
                "IndexedDB音声の再生に失敗:",
                error
            );

            playButton.textContent =
                "▶";
        }

        return;
    }


    /* =====================================
       ③ IndexedDBに存在しない
    ===================================== */

    console.log(
        "IndexedDBに存在しません:",
        song.title
    );

    nowSub.textContent =
        "オンライン再生・バックグラウンド保存";


    /* =====================================
       ④ まず即座にGitHub Releaseから再生
    ===================================== */

    console.log(
        "通常再生を即座に開始:",
        song.title
    );

    audio.src =
        song.url;

    let directPlaybackStarted =
        false;

    try {

        await audio.play();

        directPlaybackStarted =
            true;

    } catch (error) {

        console.warn(
            "GitHub Releaseからの直接再生に失敗:",
            error
        );
    }


    /* =====================================
       ⑤ 再生と同時に裏で保存
    ===================================== */

    /*
     * awaitしない。
     *
     * ここが今回の重要ポイント。
     *
     * 保存が終わるまで
     * 再生を待たせない。
     */

    saveSongInBackground(
        song
    ).then(
        success => {

            if (success) {

                console.log(
                    "オフライン再生可能になりました:",
                    song.title
                );

                /*
                 * 現在再生中なら
                 * UIだけ更新する。
                 *
                 * 再生元は途中で変更しない。
                 */

                if (
                    currentIndex === index
                ) {

                    nowSub.textContent =
                        "✓ 再生中・オフライン保存済み";
                }
            }

        }
    );


    /* =====================================
       ⑥ 直接再生できなかった場合
    ===================================== */

    if (!directPlaybackStarted) {

        console.log(
            "直接再生できないためGAS取得結果を待ちます:",
            song.title
        );

        try {

            /*
             * すでにバックグラウンド保存中なら、
             * そのPromiseを待つ。
             */

            const savePromise =
                savingSongs.get(
                    song.id
                );

            if (savePromise) {

                await savePromise;
            }

            /*
             * IndexedDBから取得
             */

            const fallbackBlob =
                await getCachedAudio(
                    song.name
                );

            if (!fallbackBlob) {

                throw new Error(
                    "GASから音声を取得できませんでした。"
                );
            }

            /*
             * 曲がまだ同じなら再生
             */

            if (
                currentIndex !== index
            ) {

                return;
            }

            currentObjectURL =
                URL.createObjectURL(
                    fallbackBlob
                );

            audio.src =
                currentObjectURL;

            nowSub.textContent =
                "✓ オフライン再生";

            await audio.play();

        } catch (error) {

            console.error(
                "GAS経由の再生にも失敗:",
                error
            );

            nowSub.textContent =
                "再生できませんでした";

            playButton.textContent =
                "▶";
        }
    }
}

/* =========================================
   時間
========================================= */

function formatTime(seconds) {

    if (
        !Number.isFinite(seconds)
    ) {

        return "0:00";
    }

    const min =
        Math.floor(
            seconds / 60
        );

    const sec =
        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(2, "0");

    return `${min}:${sec}`;
}


/* =========================================
   ファイルサイズ
========================================= */

function formatSize(bytes) {

    if (
        !Number.isFinite(bytes)
    ) {

        return "不明";
    }

    if (bytes < 1024) {

        return `${bytes} B`;
    }

    if (
        bytes <
        1024 * 1024
    ) {

        return `${(
            bytes / 1024
        ).toFixed(1)} KB`;
    }

    return `${(
        bytes /
        1024 /
        1024
    ).toFixed(2)} MB`;
}


/* =========================================
   HTMLエスケープ
========================================= */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(text);

    return div.innerHTML;
}


function escapeAttribute(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );
}

        );

})();
