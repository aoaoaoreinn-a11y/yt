<script>

/* ==========================================
   GitHub設定
========================================== */

const OWNER = "aoaoaoreinn-a11y";
const REPO = "yt";
const RELEASE_TAG = "audio";

const API_URL =
    `https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/${RELEASE_TAG}`;


/* ==========================================
   状態
========================================== */

let songs = [];

let currentIndex = -1;

let shuffled = false;

let repeating = false;


/* ==========================================
   DOM
========================================== */

const audio =
    document.getElementById("audio");

const songsContainer =
    document.getElementById("songs");

const search =
    document.getElementById("search");

const status =
    document.getElementById("status");

const nowTitle =
    document.getElementById("nowTitle");

const nowSubtitle =
    document.getElementById("nowSubtitle");

const playButton =
    document.getElementById("play");

const progress =
    document.getElementById("progress");

const currentTimeElement =
    document.getElementById("currentTime");

const durationElement =
    document.getElementById("duration");

const volume =
    document.getElementById("volume");

const shuffleButton =
    document.getElementById("shuffle");

const repeatButton =
    document.getElementById("repeat");


/* ==========================================
   GitHub Release取得
========================================== */

async function loadSongs() {

    status.textContent =
        "音声ファイルを取得しています...";

    songsContainer.innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            音声ファイルを読み込んでいます...
        </div>
    `;

    try {

        const response =
            await fetch(
                API_URL + "?t=" + Date.now()
            );

        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }

        const release =
            await response.json();

        songs =
            release.assets

                .filter(asset =>
                    asset.name
                        .toLowerCase()
                        .endsWith(".opus")
                )

                .map(asset => ({

                    name:
                        asset.name,

                    title:
                        asset.label ||
                        asset.name,

                    url:
                        asset.browser_download_url,

                    size:
                        asset.size

                }));

        /*
         * タイトル順に並べる
         */

        songs.sort((a, b) =>
            a.title.localeCompare(
                b.title,
                "ja"
            )
        );

        renderSongs();

    } catch (error) {

        console.error(error);

        status.textContent =
            "音声ファイルを取得できませんでした。";

        songsContainer.innerHTML = `
            <div class="empty">
                音声ファイルを取得できませんでした。<br>
                <small>
                    しばらく待ってから更新してください。
                </small>
            </div>
        `;

    }

}


/* ==========================================
   サイズ表示
========================================== */

function formatSize(bytes) {

    if (!bytes) {
        return "不明";
    }

    if (bytes < 1024) {
        return `${bytes} B`;
    }

    if (bytes < 1024 * 1024) {
        return `${(bytes / 1024).toFixed(1)} KB`;
    }

    return `${(bytes / 1024 / 1024).toFixed(2)} MB`;

}


/* ==========================================
   時間表示
========================================== */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const secondsPart =
        Math.floor(seconds % 60)
            .toString()
            .padStart(2, "0");

    return `${minutes}:${secondsPart}`;

}


/* ==========================================
   曲一覧
========================================== */

function renderSongs() {

    const query =
        search.value
            .trim()
            .toLowerCase();

    const filtered =
        songs.filter(song =>
            song.title
                .toLowerCase()
                .includes(query)
        );

    status.textContent =
        `${filtered.length}曲`;

    songsContainer.innerHTML = "";

    if (filtered.length === 0) {

        songsContainer.innerHTML = `
            <div class="empty">
                該当する音声ファイルがありません。
            </div>
        `;

        return;

    }


    filtered.forEach(
        (song, index) => {

            /*
             * 元の配列内でのインデックス
             */

            const realIndex =
                songs.indexOf(song);

            const element =
                document.createElement("div");

            element.className = "song";

            if (
                realIndex === currentIndex
            ) {
                element.classList.add("playing");
            }


            element.innerHTML = `

                <div class="song-number">
                    ${index + 1}
                </div>

                <div class="song-info">

                    <div class="song-title">
                        ${escapeHtml(song.title)}
                    </div>

                    <div class="song-subtitle">
                        Opus
                    </div>

                </div>

                <div class="song-size">
                    ${formatSize(song.size)}
                </div>

                <div class="song-actions">

                    <button
                        class="icon-button"
                        title="再生"
                        aria-label="再生"
                    >
                        ▶
                    </button>

                    <a
                        class="icon-button download-button"
                        href="${escapeAttribute(song.url)}"
                        download
                        title="ダウンロード"
                        aria-label="ダウンロード"
                        style="
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            text-decoration:none;
                        "
                    >
                        ↓
                    </a>

                </div>
            `;


            /*
             * 行クリックで再生
             */

            element.addEventListener(
                "click",
                event => {

                    if (
                        event.target.closest("a") ||
                        event.target.closest("button")
                    ) {
                        return;
                    }

                    playSong(realIndex);

                }
            );


            /*
             * 再生ボタン
             */

            const playSongButton =
                element.querySelector(
                    ".icon-button"
                );

            playSongButton.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    playSong(realIndex);

                }
            );


            songsContainer.appendChild(
                element
            );

        }
    );

}


/* ==========================================
   曲を再生
========================================== */

function playSong(index) {

    if (
        index < 0 ||
        index >= songs.length
    ) {
        return;
    }

    currentIndex = index;

    const song =
        songs[index];

    audio.src =
        song.url;

    audio.load();

    audio.play()
        .catch(error => {
            console.error(error);
        });

    nowTitle.textContent =
        song.title;

    nowSubtitle.textContent =
        `Opus · ${formatSize(song.size)}`;

    playButton.textContent =
        "❚❚";

    renderSongs();

}


/* ==========================================
   再生 / 停止
========================================== */

function togglePlay() {

    if (currentIndex === -1) {

        if (songs.length > 0) {
            playSong(0);
        }

        return;
    }


    if (audio.paused) {

        audio.play();

        playButton.textContent =
            "❚❚";

    } else {

        audio.pause();

        playButton.textContent =
            "▶";

    }

}


playButton.addEventListener(
    "click",
    togglePlay
);


/* ==========================================
   前の曲
========================================== */

document
    .getElementById("previous")
    .addEventListener(
        "click",
        () => {

            if (!songs.length) {
                return;
            }

            let index;

            if (shuffled) {

                index =
                    Math.floor(
                        Math.random() *
                        songs.length
                    );

            } else {

                index =
                    currentIndex <= 0
                        ? songs.length - 1
                        : currentIndex - 1;

            }

            playSong(index);

        }
    );


/* ==========================================
   次の曲
========================================== */

document
    .getElementById("next")
    .addEventListener(
        "click",
        () => {

            if (!songs.length) {
                return;
            }

            let index;

            if (shuffled) {

                index =
                    Math.floor(
                        Math.random() *
                        songs.length
                    );

            } else {

                index =
                    currentIndex >= songs.length - 1
                        ? 0
                        : currentIndex + 1;

            }

            playSong(index);

        }
    );


/* ==========================================
   シャッフル
========================================== */

shuffleButton.addEventListener(
    "click",
    () => {

        shuffled =
            !shuffled;

        shuffleButton.classList.toggle(
            "active",
            shuffled
        );

    }
);


/* ==========================================
   リピート
========================================== */

repeatButton.addEventListener(
    "click",
    () => {

        repeating =
            !repeating;

        repeatButton.classList.toggle(
            "active",
            repeating
        );

    }
);


/* ==========================================
   曲終了
========================================== */

audio.addEventListener(
    "ended",
    () => {

        if (repeating) {

            audio.currentTime = 0;

            audio.play();

            return;

        }

        document
            .getElementById("next")
            .click();

    }
);


/* ==========================================
   再生状態
========================================== */

audio.addEventListener(
    "play",
    () => {

        playButton.textContent =
            "❚❚";

    }
);


audio.addEventListener(
    "pause",
    () => {

        playButton.textContent =
            "▶";

    }
);


/* ==========================================
   時間更新
========================================== */

audio.addEventListener(
    "timeupdate",
    () => {

        if (!audio.duration) {
            return;
        }

        const percentage =
            (audio.currentTime /
            audio.duration) * 100;

        progress.value =
            percentage;

        currentTimeElement.textContent =
            formatTime(
                audio.currentTime
            );

        durationElement.textContent =
            formatTime(
                audio.duration
            );

    }
);


/* ==========================================
   シーク
========================================== */

progress.addEventListener(
    "input",
    () => {

        if (!audio.duration) {
            return;
        }

        audio.currentTime =
            (progress.value / 100) *
            audio.duration;

    }
);


/* ==========================================
   音量
========================================== */

volume.addEventListener(
    "input",
    () => {

        audio.volume =
            Number(volume.value);

    }
);


/* ==========================================
   検索
========================================== */

search.addEventListener(
    "input",
    renderSongs
);


/* ==========================================
   更新
========================================== */

document
    .getElementById("refresh")
    .addEventListener(
        "click",
        loadSongs
    );


document
    .getElementById("refreshButton")
    .addEventListener(
        "click",
        loadSongs
    );


/* ==========================================
   ホーム
========================================== */

document
    .getElementById("homeButton")
    .addEventListener(
        "click",
        () => {

            search.value = "";

            renderSongs();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }
    );


/* ==========================================
   HTMLエスケープ
========================================== */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


function escapeAttribute(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );

}


/* ==========================================
   キーボード操作
========================================== */

document.addEventListener(
    "keydown",
    event => {

        /*
         * 入力欄ではショートカットを無効
         */

        if (
            event.target.tagName ===
            "INPUT"
        ) {
            return;
        }


        /*
         * Space
         */

        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            togglePlay();

        }


        /*
         * ←
         */

        if (
            event.code ===
            "ArrowLeft"
        ) {

            audio.currentTime =
                Math.max(
                    0,
                    audio.currentTime - 5
                );

        }


        /*
         * →
         */

        if (
            event.code ===
            "ArrowRight"
        ) {

            if (audio.duration) {

                audio.currentTime =
                    Math.min(
                        audio.duration,
                        audio.currentTime + 5
                    );

            }

        }

    }
);


/* ==========================================
   起動
========================================== */

loadSongs();

</script>

</body>
</html>
