<audio id="audio" preload="metadata"></audio>

<script>

/* =========================================
   GitHub
========================================= */

const OWNER = "aoaoaoreinn-a11y";
const REPO = "yt";
const RELEASE_TAG = "audio";

const API_URL =
    `https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/${RELEASE_TAG}`;


/* =========================================
   GAS
========================================= */

const GAS_URL =
    "https://script.google.com/macros/s/AKfycbyRoupgx5PeSQjOo1XCpCExsvIp4dJ94iN8BriASIOULTUNOMaotXdZ0M1beI5x5TZ_tA/exec";


/* =========================================
   IndexedDB
========================================= */

const DB_NAME = "MyAudioLibrary";
const DB_VERSION = 1;
const STORE_NAME = "audio";

let db = null;


/* =========================================
   保存中の曲
   同じ曲を複数回保存しないため
========================================= */

const savingSongs = new Map();


/* =========================================
   IndexedDBを開く
========================================= */

function openDatabase() {

    return new Promise((resolve, reject) => {

        if (!("indexedDB" in window)) {

            reject(
                new Error("IndexedDBが利用できません。")
            );

            return;
        }

        const request =
            indexedDB.open(
                DB_NAME,
                DB_VERSION
            );

        request.onupgradeneeded = event => {

            const database =
                event.target.result;

            if (
                !database.objectStoreNames
                    .contains(STORE_NAME)
            ) {

                database.createObjectStore(
                    STORE_NAME,
                    { keyPath: "name" }
                );
            }
        };

        request.onsuccess = event => {

            db =
                event.target.result;

            db.onversionchange = () => {
                db.close();
            };

            resolve(db);
        };

        request.onerror = () => {

            reject(
                request.error ||
                new Error(
                    "IndexedDBを開けませんでした。"
                )
            );
        };
    });
}


/* =========================================
   IndexedDBから取得
========================================= */

function getCachedAudio(name) {

    return new Promise((resolve, reject) => {

        if (!db) {

            resolve(null);

            return;
        }

        const transaction =
            db.transaction(
                STORE_NAME,
                "readonly"
            );

        const store =
            transaction.objectStore(
                STORE_NAME
            );

        const request =
            store.get(name);

        request.onsuccess = () => {

            const result =
                request.result;

            if (
                !result ||
                !(result.data instanceof Blob)
            ) {

                resolve(null);

                return;
            }

            resolve(result.data);
        };

        request.onerror = () => {

            reject(
                request.error ||
                new Error(
                    "IndexedDB読み込みエラー"
                )
            );
        };
    });
}


/* =========================================
   IndexedDBへ保存
========================================= */

function saveAudio(name, blob) {

    return new Promise((resolve, reject) => {

        if (!db) {

            reject(
                new Error(
                    "IndexedDBが開かれていません。"
                )
            );

            return;
        }

        const transaction =
            db.transaction(
                STORE_NAME,
                "readwrite"
            );

        const store =
            transaction.objectStore(
                STORE_NAME
            );

        const request =
            store.put({
                name: name,
                data: blob,
                savedAt: Date.now()
            });

        request.onsuccess = () => {
            resolve();
        };

        request.onerror = () => {

            reject(
                request.error ||
                new Error(
                    "IndexedDB保存エラー"
                )
            );
        };
    });
}


/* =========================================
   曲のキャッシュ状態
========================================= */

const cacheStatus = new Map();


function setCacheStatus(name, status) {

    cacheStatus.set(name, status);

    updateSongCacheStatus(name);

    if (
        currentIndex !== -1 &&
        songs[currentIndex] &&
        songs[currentIndex].name === name
    ) {

        updateNowPlayingStatus(
            songs[currentIndex],
            status
        );
    }
}


function getCacheStatusText(status) {

    switch (status) {

        case "saved":
            return "✓ オフライン";

        case "saving":
            return "↓ 保存中...";

        case "error":
            return "保存失敗";

        default:
            return "";
    }
}


function updateSongCacheStatus(name) {

    const elements =
        document.querySelectorAll(
            `.song[data-name="${cssEscape(name)}"]`
        );

    elements.forEach(element => {

        const statusElement =
            element.querySelector(
                ".cache-status"
            );

        if (!statusElement) {
            return;
        }

        const status =
            cacheStatus.get(name);

        statusElement.textContent =
            getCacheStatusText(status);

        statusElement.className =
            "cache-status " +
            (status || "");
    });
}


function updateNowPlayingStatus(song, status) {

    const text =
        getCacheStatusText(status);

    if (text) {

        nowSub.textContent =
            text;

    } else {

        nowSub.textContent =
            "My Audio Library";
    }
}


/* =========================================
   CSS.escape互換
========================================= */

function cssEscape(text) {

    if (
        window.CSS &&
        typeof window.CSS.escape === "function"
    ) {

        return window.CSS.escape(text);
    }

    return String(text)
        .replace(/\\/g, "\\\\")
        .replace(/"/g, '\\"');
}


/* =========================================
   状態
========================================= */

let songs = [];
let currentIndex = -1;
let currentObjectURL = null;

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("play");

const progress =
    document.getElementById("progress");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const nowTitle =
    document.getElementById("nowTitle");

const nowSub =
    document.getElementById("nowSub");


/* =========================================
   GitHubから曲一覧取得
========================================= */

async function loadSongs() {

    const status =
        document.getElementById("status");

    try {

        const response =
            await fetch(API_URL);

        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const release =
            await response.json();

        songs =
            Array.isArray(release.assets)

                ? release.assets
                    .filter(asset =>
                        typeof asset.name === "string" &&
                        asset.name
                            .toLowerCase()
                            .endsWith(".opus")
                    )
                    .map(asset => ({
                        name: asset.name,
                        title:
                            asset.label ||
                            asset.name,
                        id:
                            asset.name
                                .replace(
                                    /\.opus$/i,
                                    ""
                                ),
                        url:
                            asset.browser_download_url,
                        size:
                            asset.size
                    }))

                : [];

        renderSongs();

        status.textContent =
            `${songs.length}曲`;

        /* =====================================
           起動時にキャッシュ状態を確認
        ===================================== */

        checkAllCacheStatus();

    } catch (error) {

        console.error(
            "曲一覧の取得に失敗しました:",
            error
        );

        status.textContent =
            "音声ファイルを取得できませんでした。";
    }
}


/* =========================================
   全曲のキャッシュ状態を確認
========================================= */

async function checkAllCacheStatus() {

    if (!db) {
        return;
    }

    for (const song of songs) {

        try {

            const blob =
                await getCachedAudio(
                    song.name
                );

            if (blob) {

                setCacheStatus(
                    song.name,
                    "saved"
                );
            }

        } catch (error) {

            console.warn(
                "キャッシュ確認失敗:",
                song.title,
                error
            );
        }
    }
}


/* =========================================
   一覧表示
========================================= */

function renderSongs() {

    const container =
        document.getElementById("songs");

    const status =
        document.getElementById("status");

    const keyword =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();

    container.innerHTML = "";

    const filtered =
        songs.filter(song =>
            song.title
                .toLowerCase()
                .includes(keyword)
        );

    status.textContent =
        `${filtered.length}曲`;

    if (!filtered.length) {

        container.innerHTML = `
            <div class="empty">
                曲が見つかりません。
            </div>
        `;

        return;
    }

    filtered.forEach((song, index) => {

        const realIndex =
            songs.indexOf(song);

        const element =
            document.createElement("div");

        element.className = "song";

        element.dataset.name =
            song.name;

        const cacheState =
            cacheStatus.get(song.name) ||
            "";

        element.innerHTML = `
            <div class="song-number">
                ${index + 1}
            </div>

            <div class="song-info">

                <div class="song-title">
                    ${escapeHtml(song.title)}
                </div>

                <div class="song-meta">

                    <span>
                        ${formatSize(song.size)}
                    </span>

                    <span
                        class="cache-status ${cacheState}"
                    >
                        ${getCacheStatusText(cacheState)}
                    </span>

                </div>

            </div>

            <a
                class="download"
                href="${escapeAttribute(song.url)}"
                download
                title="ダウンロード"
                onclick="event.stopPropagation()"
            >
                ↓
            </a>

            <button
                class="play-button"
                title="再生"
                type="button"
            >
                ▶
            </button>
        `;

        const button =
            element.querySelector(
                ".play-button"
            );

        button.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                playSong(realIndex);
            }
        );

        element.addEventListener(
            "click",
            () => {

                playSong(realIndex);
            }
        );

        container.appendChild(element);
    });
}


/* =========================================
   Base64 → Blob
========================================= */

function base64ToBlob(
    base64,
    mimeType
) {

    const binary =
        atob(base64);

    const bytes =
        new Uint8Array(
            binary.length
        );

    const chunkSize =
        1024 * 1024;

    for (
        let offset = 0;
        offset < binary.length;
        offset += chunkSize
    ) {

        const end =
            Math.min(
                offset + chunkSize,
                binary.length
            );

        for (
            let i = offset;
            i < end;
            i++
        ) {

            bytes[i] =
                binary.charCodeAt(i);
        }
    }

    return new Blob(
        [bytes],
        {
            type:
                mimeType ||
                "audio/ogg"
        }
    );
}


/* =========================================
   GASから音声を取得
========================================= */

function getAudioFromGAS(videoId) {

    return new Promise(
        (resolve, reject) => {

            const callbackName =
                "__gasAudio_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .slice(2);

            const script =
                document.createElement(
                    "script"
                );

            let finished = false;

            const cleanup = () => {

                if (finished) {
                    return;
                }

                finished = true;

                delete window[
                    callbackName
                ];

                script.remove();
            };

            window[callbackName] =
                data => {

                    if (finished) {
                        return;
                    }

                    cleanup();

                    if (
                        !data ||
                        data.error
                    ) {

                        reject(
                            new Error(
                                data?.error ||
                                "GASから音声データを取得できませんでした。"
                            )
                        );

                        return;
                    }

                    if (!data.data) {

                        reject(
                            new Error(
                                "GASから音声データが返されませんでした。"
                            )
                        );

                        return;
                    }

                    try {

                        const blob =
                            base64ToBlob(
                                data.data,
                                data.mimeType ||
                                "audio/ogg"
                            );

                        resolve({
                            blob:
                                blob,

                            name:
                                data.name,

                            label:
                                data.label
                        });

                    } catch (error) {

                        reject(error);
                    }
                };

            script.onerror = () => {

                cleanup();

                reject(
                    new Error(
                        "GASへの接続に失敗しました。"
                    )
                );
            };

            script.src =
                GAS_URL +
                "?id=" +
                encodeURIComponent(
                    videoId
                ) +
                "&callback=" +
                encodeURIComponent(
                    callbackName
                );

            document.head.appendChild(
                script
            );
        }
    );
}


/* =========================================
   バックグラウンド保存
========================================= */

async function saveSongInBackground(song) {

    if (!db) {

        console.warn(
            "IndexedDBがないため保存できません:",
            song.title
        );

        return;
    }


    /* =====================================
       すでに保存中なら何もしない
    ===================================== */

    if (
        savingSongs.has(song.name)
    ) {

        console.log(
            "すでに保存中:",
            song.title
        );

        return savingSongs.get(
            song.name
        );
    }


    const savePromise =
        (async () => {

            setCacheStatus(
                song.name,
                "saving"
            );

            console.log(
                "バックグラウンド保存開始:",
                song.title
            );

            try {

                const result =
                    await getAudioFromGAS(
                        song.id
                    );

                console.log(
                    "GASから音声取得完了:",
                    result.name
                );


                await saveAudio(
                    song.name,
                    result.blob
                );


                setCacheStatus(
                    song.name,
                    "saved"
                );

                console.log(
                    "IndexedDBへ保存しました:",
                    song.title
                );

            } catch (error) {

                console.warn(
                    "バックグラウンド保存失敗:",
                    song.title,
                    error
                );

                setCacheStatus(
                    song.name,
                    "error"
                );

            } finally {

                savingSongs.delete(
                    song.name
                );
            }

        })();

    savingSongs.set(
        song.name,
        savePromise
    );

    return savePromise;
}


/* =========================================
   曲を再生
========================================= */

async function playSong(index) {

    if (!songs[index]) {
        return;
    }

    currentIndex = index;

    const song =
        songs[index];


    nowTitle.textContent =
        song.title;

    playButton.textContent =
        "▶";


    /* =====================================
       前のBlob URLを解放
    ===================================== */

    if (currentObjectURL) {

        URL.revokeObjectURL(
            currentObjectURL
        );

        currentObjectURL = null;
    }


    audio.pause();


    /* =====================================
       ① IndexedDB確認
    ===================================== */

    let cachedBlob = null;

    try {

        cachedBlob =
            await getCachedAudio(
                song.name
            );

    } catch (error) {

        console.warn(
            "IndexedDB読み込み失敗:",
            error
        );
    }


    /* =====================================
       ② IndexedDBに存在
    ===================================== */

    if (cachedBlob) {

        console.log(
            "IndexedDBから再生:",
            song.title
        );

        setCacheStatus(
            song.name,
            "saved"
        );

        currentObjectURL =
            URL.createObjectURL(
                cachedBlob
            );

        audio.src =
            currentObjectURL;

        try {

            await audio.play();

        } catch (error) {

            console.error(
                "IndexedDB音声の再生に失敗:",
                error
            );

            playButton.textContent =
                "▶";
        }

        return;
    }


    /* =====================================
       ③ IndexedDBに存在しない
    ===================================== */

    console.log(
        "IndexedDBに存在しません:",
        song.title
    );


    /*
       ここが今回の重要部分。

       保存完了を待たない。
       まずGitHub Releaseを直接audioへ設定する。
    */


    setCacheStatus(
        song.name,
        "saving"
    );

    nowSub.textContent =
        "再生中・バックグラウンド保存中";


    /* =====================================
       ④ すぐに通常再生
    ===================================== */

    audio.src =
        song.url;

    try {

        await audio.play();

    } catch (playError) {

        console.error(
            "通常再生に失敗:",
            playError
        );

        playButton.textContent =
            "▶";
    }


    /* =====================================
       ⑤ 裏でIndexedDB保存
       再生を待たせない
    ===================================== */

    saveSongInBackground(song);

}


/* =========================================
   再生 / 一時停止
========================================= */

playButton.addEventListener(
    "click",
    async () => {

        if (currentIndex === -1) {

            if (songs.length) {

                await playSong(0);
            }

            return;
        }

        if (audio.paused) {

            try {

                await audio.play();

            } catch (error) {

                console.error(
                    "再生に失敗:",
                    error
                );
            }

        } else {

            audio.pause();
        }
    }
);


audio.addEventListener(
    "play",
    () => {

        playButton.textContent =
            "Ⅱ";
    }
);


audio.addEventListener(
    "pause",
    () => {

        playButton.textContent =
            "▶";
    }
);


/* =========================================
   前の曲
========================================= */

document
    .getElementById("prev")
    .addEventListener(
        "click",
        () => {

            if (!songs.length) {
                return;
            }

            const index =
                currentIndex <= 0
                    ? songs.length - 1
                    : currentIndex - 1;

            playSong(index);
        }
    );


/* =========================================
   次の曲
========================================= */

document
    .getElementById("next")
    .addEventListener(
        "click",
        () => {

            if (!songs.length) {
                return;
            }

            const index =
                currentIndex >=
                songs.length - 1

                    ? 0

                    : currentIndex + 1;

            playSong(index);
        }
    );


/* =========================================
   自動で次の曲
========================================= */

audio.addEventListener(
    "ended",
    () => {

        if (!songs.length) {
            return;
        }

        const next =
            currentIndex >=
            songs.length - 1

                ? 0

                : currentIndex + 1;

        playSong(next);
    }
);


/* =========================================
   メタデータ
========================================= */

audio.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(
                audio.duration
            );

        progress.value = 0;
    }
);


/* =========================================
   再生位置
========================================= */

audio.addEventListener(
    "timeupdate",
    () => {

        if (
            !Number.isFinite(
                audio.duration
            ) ||
            audio.duration <= 0
        ) {

            return;
        }

        progress.value =
            (
                audio.currentTime /
                audio.duration
            ) * 100;

        currentTime.textContent =
            formatTime(
                audio.currentTime
            );
    }
);


/* =========================================
   シーク
========================================= */

progress.addEventListener(
    "input",
    () => {

        if (
            !Number.isFinite(
                audio.duration
            ) ||
            audio.duration <= 0
        ) {

            return;
        }

        audio.currentTime =
            (
                progress.value / 100
            ) *
            audio.duration;
    }
);


/* =========================================
   音量
========================================= */

document
    .getElementById("volume")
    .addEventListener(
        "input",
        event => {

            audio.volume =
                Number(
                    event.target.value
                );
        }
    );


/* =========================================
   検索
========================================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderSongs
    );


/* =========================================
   時間
========================================= */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {

        return "0:00";
    }

    const min =
        Math.floor(
            seconds / 60
        );

    const sec =
        Math.floor(
            seconds % 60
        )
        .toString()
        .padStart(2, "0");

    return `${min}:${sec}`;
}


/* =========================================
   ファイルサイズ
========================================= */

function formatSize(bytes) {

    if (!Number.isFinite(bytes)) {

        return "不明";
    }

    if (bytes < 1024) {

        return `${bytes} B`;
    }

    if (
        bytes <
        1024 * 1024
    ) {

        return `${(
            bytes / 1024
        ).toFixed(1)} KB`;
    }

    return `${(
        bytes /
        1024 /
        1024
    ).toFixed(2)} MB`;
}


/* =========================================
   HTMLエスケープ
========================================= */

function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(text);

    return div.innerHTML;
}


function escapeAttribute(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );
}


/* =========================================
   起動
========================================= */

(async function init() {

    try {

        await openDatabase();

        console.log(
            "IndexedDB initialized."
        );

    } catch (error) {

        console.warn(
            "IndexedDBを利用できません。通常再生で動作します:",
            error
        );
    }

    await loadSongs();

})();
</script>
