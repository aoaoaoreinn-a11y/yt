<script>

/* =========================
   GitHub
========================= */

const OWNER = "aoaoaoreinn-a11y";
const REPO = "yt";

/*
 * 古いデータとの互換用。
 *
 * 通常はGASが返す song.url を使用するため、
 * この値は基本的に使われません。
 */
const RELEASE_TAG = "audio";


/* =========================
   GAS
========================= */

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbyRoupgx5PeSQjOo1XCpCExsvIp4dJ94iN8BriASIOULTUNOMaotXdZ0M1beI5x5TZ_tA/exec";


/* =========================
   IndexedDB
========================= */

const DB_NAME = "MyAudioLibrary";
const DB_VERSION = 1;
const STORE_NAME = "audio";

let db = null;

const cachingSongs = new Set();


function openDatabase() {

  return new Promise((resolve, reject) => {

    if (!("indexedDB" in window)) {

      reject(
        new Error("IndexedDBが利用できません。")
      );

      return;
    }


    const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );


    request.onupgradeneeded = event => {

      const database =
        event.target.result;


      if (
        !database.objectStoreNames.contains(
          STORE_NAME
        )
      ) {

        database.createObjectStore(
          STORE_NAME,
          {
            keyPath: "name"
          }
        );

      }

    };


    request.onsuccess = event => {

      db = event.target.result;


      db.onversionchange = () => {

        db.close();

      };


      console.log(
        "IndexedDB initialized."
      );


      resolve(db);

    };


    request.onerror = () => {

      reject(
        request.error ||
        new Error(
          "IndexedDBを開けませんでした。"
        )
      );

    };

  });

}


function getCachedAudio(name) {

  return new Promise((resolve, reject) => {

    if (!db) {

      resolve(null);

      return;
    }


    let transaction;


    try {

      transaction =
        db.transaction(
          STORE_NAME,
          "readonly"
        );

    } catch (error) {

      reject(error);

      return;
    }


    const request =
      transaction
        .objectStore(STORE_NAME)
        .get(name);


    request.onsuccess = () => {

      const result =
        request.result;


      resolve(
        result &&
        result.data instanceof Blob
          ? result.data
          : null
      );

    };


    request.onerror = () => {

      reject(
        request.error ||
        new Error(
          "IndexedDB読み込みエラー"
        )
      );

    };

  });

}


function saveAudio(name, blob) {

  return new Promise((resolve, reject) => {

    if (!db) {

      reject(
        new Error(
          "IndexedDBが開かれていません。"
        )
      );

      return;
    }


    const request =
      db
        .transaction(
          STORE_NAME,
          "readwrite"
        )
        .objectStore(STORE_NAME)
        .put({

          name: name,

          data: blob,

          savedAt: Date.now()

        });


    request.onsuccess = resolve;


    request.onerror = () => {

      reject(
        request.error ||
        new Error(
          "IndexedDB保存エラー"
        )
      );

    };

  });

}


/* =========================
   状態
========================= */

let songs = [];

let currentIndex = -1;

let shuffled = false;

let repeating = false;

let currentObjectURL = null;


/* =========================
   DOM
========================= */

const audio =
  document.getElementById("audio");


const songsContainer =
  document.getElementById("songs");


const search =
  document.getElementById("search");


const status =
  document.getElementById("status");


const nowTitle =
  document.getElementById("nowTitle");


const nowSubtitle =
  document.getElementById("nowSubtitle");


const playButton =
  document.getElementById("play");


const progress =
  document.getElementById("progress");


const currentTimeElement =
  document.getElementById("currentTime");


const durationElement =
  document.getElementById("duration");


const volume =
  document.getElementById("volume");


const shuffleButton =
  document.getElementById("shuffle");


const repeatButton =
  document.getElementById("repeat");


/* =========================
   GAS JSONP
========================= */

function callGAS(params) {

  return new Promise((resolve, reject) => {

    const callbackName =
      "__gas_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2);


    const script =
      document.createElement("script");


    let finished = false;


    const cleanup = () => {

      if (finished) return;

      finished = true;

      delete window[callbackName];

      script.remove();

    };


    const timeout =
      setTimeout(() => {

        cleanup();

        reject(
          new Error(
            "GASへの接続がタイムアウトしました。"
          )
        );

      }, 30000);


    window[callbackName] = data => {

      if (finished) return;

      clearTimeout(timeout);

      cleanup();


      if (!data || data.error) {

        reject(
          new Error(
            data?.error ||
            "GASエラー"
          )
        );

        return;
      }


      resolve(data);

    };


    script.onerror = () => {

      clearTimeout(timeout);

      cleanup();

      reject(
        new Error(
          "GASへの接続に失敗しました。"
        )
      );

    };


    const query =
      new URLSearchParams({

        ...params,

        callback: callbackName

      });


    script.src =
      GAS_URL +
      "?" +
      query.toString();


    document.head.appendChild(script);

  });

}


/* =========================
   GAS → 音声
========================= */

/*
 * videoIdだけでなく、
 * その曲が入っているReleaseのreleaseTagも渡す。
 */
async function getAudioFromGAS(
  videoId,
  releaseTag
) {

  const params = {

    id: videoId

  };


  /*
   * GAS側でreleaseTagを指定して取得する。
   */
  if (releaseTag) {

    params.release =
      releaseTag;

  }


  const data =
    await callGAS(params);


  if (!data.data) {

    throw new Error(
      "GASから音声データが返されませんでした。"
    );

  }


  return {

    blob:
      base64ToBlob(
        data.data,
        data.mimeType || "audio/ogg"
      ),

    name:
      data.name,

    label:
      data.label,

    releaseTag:
      data.releaseTag,

    url:
      data.url

  };

}


/* =========================
   Base64 → Blob
========================= */

function base64ToBlob(
  base64,
  mimeType
) {

  const binary =
    atob(base64);


  const bytes =
    new Uint8Array(
      binary.length
    );


  for (
    let i = 0;
    i < binary.length;
    i++
  ) {

    bytes[i] =
      binary.charCodeAt(i);

  }


  return new Blob(
    [bytes],
    {
      type:
        mimeType ||
        "audio/ogg"
    }
  );

}


/* =========================
   バックグラウンド保存
========================= */

async function cacheSongInBackground(song) {

  if (
    cachingSongs.has(song.name)
  ) {

    return;

  }


  cachingSongs.add(
    song.name
  );


  try {

    console.log(
      "バックグラウンド保存開始:",
      song.title,
      "Release:",
      song.releaseTag
    );


    /*
     * 曲ごとのreleaseTagをGASへ渡す。
     */
    const result =
      await getAudioFromGAS(
        song.id,
        song.releaseTag
      );


    await saveAudio(
      song.name,
      result.blob
    );


    console.log(
      "IndexedDBへバックグラウンド保存完了:",
      song.title
    );


  } catch (error) {

    console.warn(
      "バックグラウンド保存失敗:",
      song.title,
      error
    );


  } finally {

    cachingSongs.delete(
      song.name
    );

  }

}


/* =========================
   GitHub直接URL
========================= */

/*
 * GASが返したsong.urlを最優先で使用する。
 *
 * 例：
 * song.url =
 * https://github.com/aoaoaoreinn-a11y/yt/releases/download/audio-002/abc123.opus
 */
function getDirectAudioURL(song) {

  if (
    song &&
    typeof song.url === "string" &&
    song.url.trim() !== ""
  ) {

    return song.url;

  }


  /*
   * song.urlがない古いデータ用の予備処理。
   */
  if (
    song &&
    song.releaseTag &&
    song.name
  ) {

    return(
      "https://github.com/" +
      OWNER +
      "/" +
      REPO +
      "/releases/download/" +
      encodeURIComponent(
        song.releaseTag
      ) +
      "/" +
      encodeURIComponent(
        song.name
      )
    );

  }


  /*
   * 最終的な互換用。
   */
  return(
    "https://github.com/" +
    OWNER +
    "/" +
    REPO +
    "/releases/download/" +
    RELEASE_TAG +
    "/" +
    encodeURIComponent(
      song.name
    )
  );

}


/* =========================
   曲一覧
========================= */

async function loadSongs() {

  status.textContent =
    "音声ファイルを取得しています...";


  songsContainer.innerHTML = `
    <div class="loading">

      <div class="spinner"></div>

      音声ファイルを読み込んでいます...

    </div>
  `;


  try {

    console.log(
      "GASから曲一覧を取得しています..."
    );


    const data =
      await callGAS({

        list: "1"

      });


    songs =
      Array.isArray(data.assets)
        ? data.assets
        : [];


    /*
     * GASから返ってくる想定の形式：
     *
     * {
     *   id: "動画ID",
     *   name: "動画ID.opus",
     *   title: "曲名",
     *   releaseTag: "audio-002",
     *   url: "https://github.com/...",
     *   size: 123456
     * }
     */


    songs.sort(
      (a, b) =>
        String(a.title || "")
          .localeCompare(
            String(b.title || ""),
            "ja"
          )
    );


    renderSongs();


    status.textContent =
      `${songs.length}曲`;


    console.log(
      "曲一覧取得完了:",
      songs.length,
      "曲"
    );


  } catch (error) {

    console.error(
      "曲一覧の取得に失敗しました:",
      error
    );


    status.textContent =
      "音声ファイルを取得できませんでした。";


    songsContainer.innerHTML = `
      <div class="empty">

        音声ファイルを取得できませんでした。<br>

        <small>
          しばらく待ってから更新してください。
        </small>

      </div>
    `;

  }

}


/* =========================
   サイズ
========================= */

function formatSize(bytes) {

  bytes =
    Number(bytes);


  if (
    !Number.isFinite(bytes)
  ) {

    return "不明";

  }


  if (bytes < 1024) {

    return `${bytes} B`;

  }


  if (bytes < 1024 * 1024) {

    return(
      `${(bytes / 1024).toFixed(1)} KB`
    );

  }


  return(
    `${(bytes / 1024 / 1024).toFixed(2)} MB`
  );

}


/* =========================
   時間
========================= */

function formatTime(seconds) {

  if (
    !Number.isFinite(seconds)
  ) {

    return "0:00";

  }


  const minutes =
    Math.floor(
      seconds / 60
    );


  const secondsPart =
    Math.floor(
      seconds % 60
    )
      .toString()
      .padStart(
        2,
        "0"
      );


  return(
    `${minutes}:${secondsPart}`
  );

}


/* =========================
   曲一覧描画
========================= */

function renderSongs() {

  const query =
    search.value
      .trim()
      .toLowerCase();


  const filtered =
    songs.filter(song =>
      String(song.title || "")
        .toLowerCase()
        .includes(query)
    );


  status.textContent =
    `${filtered.length}曲`;


  songsContainer.innerHTML =
    "";


  if (!filtered.length) {

    songsContainer.innerHTML =
      `
      <div class="empty">

        該当する音声ファイルがありません。

      </div>
      `;

    return;

  }


  filtered.forEach(
    (song, index) => {

      const realIndex =
        songs.indexOf(song);


      const element =
        document.createElement("div");


      element.className =
        "song";


      if (
        realIndex === currentIndex
      ) {

        element.classList.add(
          "playing"
        );

      }


      element.innerHTML = `

        <div class="song-number">

          ${index + 1}

        </div>


        <div class="song-info">

          <div class="song-title">

            ${escapeHtml(
              song.title ||
              song.name
            )}

          </div>


          <div class="song-subtitle">

            Opus

          </div>

        </div>


        <div class="song-size">

          ${formatSize(song.size)}

        </div>


        <div class="song-actions">

          <button
            class="icon-button"
            title="再生"
            aria-label="再生"
            type="button"
          >
            ▶
          </button>


          <a
            class="icon-button download-button"
            href="${escapeAttribute(
              getDirectAudioURL(song)
            )}"
            download
            title="ダウンロード"
            aria-label="ダウンロード"
          >
            ↓
          </a>

        </div>

      `;


      element.addEventListener(
        "click",
        event => {

          if (
            event.target.closest("button") ||
            event.target.closest("a")
          ) {

            return;

          }


          playSong(realIndex);

        }
      );


      element
        .querySelector("button")
        .addEventListener(
          "click",
          event => {

            event.stopPropagation();

            playSong(realIndex);

          }
        );


      songsContainer.appendChild(
        element
      );

    }
  );

}


/* =========================
   曲再生
========================= */

async function playSong(index) {

  if (
    index < 0 ||
    index >= songs.length
  ) {

    return;

  }


  currentIndex =
    index;


  const song =
    songs[index];


  nowTitle.textContent =
    song.title ||
    song.name;


  nowSubtitle.textContent =
    `Opus · ${formatSize(song.size)}`;


  playButton.textContent =
    "▶";


  if (
    currentObjectURL
  ) {

    URL.revokeObjectURL(
      currentObjectURL
    );


    currentObjectURL =
      null;

  }


  audio.pause();


  renderSongs();


  let cachedBlob =
    null;


  try {

    cachedBlob =
      await getCachedAudio(
        song.name
      );

  } catch (error) {

    console.warn(
      "IndexedDB読み込み失敗:",
      error
    );

  }


  /* =========================
     キャッシュあり
  ========================= */

  if (cachedBlob) {

    console.log(
      "IndexedDBから再生:",
      song.title
    );


    currentObjectURL =
      URL.createObjectURL(
        cachedBlob
      );


    audio.src =
      currentObjectURL;


    try {

      await audio.play();

    } catch (error) {

      console.error(
        "IndexedDB音声の再生に失敗:",
        error
      );

    }


    return;

  }


  /* =========================
     キャッシュなし
  ========================= */

  console.log(
    "IndexedDBに存在しません:",
    song.title,
    "Release:",
    song.releaseTag
  );


  /*
   * 固定のaudioではなく、
   * GASが返した曲ごとのURLを使用。
   */
  audio.src =
    getDirectAudioURL(song);


  try {

    await audio.play();


    console.log(
      "通常再生を即時開始:",
      song.title,
      "URL:",
      getDirectAudioURL(song)
    );


  } catch (error) {

    console.error(
      "通常再生に失敗:",
      error
    );

  }


  /*
   * 再生を止めずにバックグラウンド保存。
   */
  cacheSongInBackground(
    song
  );

}


/* =========================
   再生 / 一時停止
========================= */

playButton.addEventListener(
  "click",
  async () => {

    if (
      currentIndex === -1
    ) {

      if (songs.length) {

        await playSong(0);

      }

      return;

    }


    if (audio.paused) {

      try {

        await audio.play();

      } catch (error) {

        console.error(
          "再生に失敗:",
          error
        );

      }

    } else {

      audio.pause();

    }

  }
);


/* =========================
   再生状態
========================= */

audio.addEventListener(
  "play",
  () => {

    playButton.textContent =
      "❚❚";

  }
);


audio.addEventListener(
  "pause",
  () => {

    playButton.textContent =
      "▶";

  }
);


/* =========================
   前後
========================= */

function changeSong(direction) {

  if (
    !songs.length
  ) {

    return;

  }


  let index;


  if (shuffled) {

    index =
      Math.floor(
        Math.random() *
        songs.length
      );

  } else {

    index =
      currentIndex +
      direction;


    if (
      index < 0
    ) {

      index =
        songs.length - 1;

    }


    if (
      index >= songs.length
    ) {

      index =
        0;

    }

  }


  playSong(index);

}


document
  .getElementById("previous")
  .addEventListener(
    "click",
    () => changeSong(-1)
  );


document
  .getElementById("next")
  .addEventListener(
    "click",
    () => changeSong(1)
  );


/* =========================
   シャッフル
========================= */

shuffleButton.addEventListener(
  "click",
  () => {

    shuffled =
      !shuffled;


    shuffleButton.classList.toggle(
      "active",
      shuffled
    );

  }
);


/* =========================
   リピート
========================= */

repeatButton.addEventListener(
  "click",
  () => {

    repeating =
      !repeating;


    repeatButton.classList.toggle(
      "active",
      repeating
    );

  }
);


/* =========================
   曲終了
========================= */

audio.addEventListener(
  "ended",
  () => {

    if (repeating) {

      audio.currentTime =
        0;


      audio.play();

      return;

    }


    changeSong(1);

  }
);


/* =========================
   メタデータ
========================= */

audio.addEventListener(
  "loadedmetadata",
  () => {

    durationElement.textContent =
      formatTime(
        audio.duration
      );


    progress.value =
      0;

  }
);


/* =========================
   再生位置
========================= */

audio.addEventListener(
  "timeupdate",
  () => {

    if (
      !Number.isFinite(
        audio.duration
      ) ||
      audio.duration <= 0
    ) {

      return;

    }


    progress.value =
      audio.currentTime /
      audio.duration *
      100;


    currentTimeElement.textContent =
      formatTime(
        audio.currentTime
      );

  }
);


/* =========================
   シーク
========================= */

progress.addEventListener(
  "input",
  () => {

    if (
      !Number.isFinite(
        audio.duration
      ) ||
      audio.duration <= 0
    ) {

      return;

    }


    audio.currentTime =
      progress.value /
      100 *
      audio.duration;

  }
);


/* =========================
   音量
========================= */

volume.addEventListener(
  "input",
  () => {

    audio.volume =
      Number(
        volume.value
      );

  }
);


/* =========================
   検索
========================= */

search.addEventListener(
  "input",
  renderSongs
);


/* =========================
   更新
========================= */

document
  .getElementById("refresh")
  .addEventListener(
    "click",
    loadSongs
  );


document
  .getElementById("refreshButton")
  .addEventListener(
    "click",
    loadSongs
  );


/* =========================
   ホーム
========================= */

document
  .getElementById("homeButton")
  .addEventListener(
    "click",
    () => {

      search.value =
        "";


      renderSongs();


      window.scrollTo({

        top: 0,

        behavior: "smooth"

      });

    }
  );


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(text) {

  const div =
    document.createElement("div");


  div.textContent =
    String(text);


  return div.innerHTML;

}


function escapeAttribute(text) {

  return String(text)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    );

}


/* =========================
   キーボード
========================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.target.tagName === "INPUT"
    ) {

      return;

    }


    if (
      event.code === "Space"
    ) {

      event.preventDefault();

      playButton.click();

    }


    if (
      event.code === "ArrowLeft"
    ) {

      audio.currentTime =
        Math.max(
          0,
          audio.currentTime - 5
        );

    }


    if (
      event.code === "ArrowRight" &&
      audio.duration
    ) {

      audio.currentTime =
        Math.min(
          audio.duration,
          audio.currentTime + 5
        );

    }

  }
);


/* =========================
   起動
========================= */

(async () => {

  try {

    await openDatabase();

  } catch (error) {

    console.warn(
      "IndexedDBを利用できません。通常再生で動作します:",
      error
    );

  }


  await loadSongs();

})();
</script>
