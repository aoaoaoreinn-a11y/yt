<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>音声ファイル</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #121212;
    color: #fff;

    padding-bottom: 110px;
    overflow-x: hidden;
}

header {
    padding: 28px 32px 20px;
    background: #121212;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin: 6px 0 0;
    color: #aaa;
    font-size: 13px;
}

main {
    width: 100%;
    max-width: 1000px;
    margin: auto;
    padding: 0 24px 30px;
}

.search {
    width: 100%;
    height: 46px;

    border: 0;
    border-radius: 24px;

    padding: 0 18px;

    background: #242424;
    color: #fff;

    font-size: 15px;
    outline: none;
}

.search::placeholder {
    color: #888;
}

.search:focus {
    background: #2c2c2c;
}

.status {
    margin: 20px 4px 12px;
    color: #999;
    font-size: 13px;
}

.song {
    display: flex;
    align-items: center;
    gap: 14px;

    width: 100%;
    min-width: 0;

    padding: 12px 14px;
    margin-bottom: 4px;

    border-radius: 8px;

    cursor: pointer;
    transition: background .15s;
}

.song:hover {
    background: #242424;
}

.song-number {
    width: 28px;
    flex-shrink: 0;

    text-align: center;
    color: #888;
    font-size: 14px;
}

.song-info {
    flex: 1;
    min-width: 0;
}

.song-title {
    font-size: 15px;
    line-height: 1.4;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.song-size {
    margin-top: 3px;
    color: #777;
    font-size: 11px;
}

.song-status {
    flex-shrink: 0;
    color: #777;
    font-size: 11px;
}

.play-button {
    width: 38px;
    height: 38px;

    flex-shrink: 0;

    border: 0;
    border-radius: 50%;

    background: #fff;
    color: #111;

    font-size: 16px;
    cursor: pointer;
}

.play-button:hover {
    transform: scale(1.04);
}

.download {
    flex-shrink: 0;

    color: #aaa;
    text-decoration: none;

    font-size: 13px;
}

.download:hover {
    color: #fff;
}

.empty {
    padding: 60px 20px;
    text-align: center;
    color: #777;
}

.player {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    z-index: 1000;

    height: 92px;

    background: #181818;
    border-top: 1px solid #303030;

    display: grid;

    grid-template-columns:
        minmax(150px, 1fr)
        minmax(300px, 2fr)
        minmax(150px, 1fr);

    align-items: center;

    padding: 10px 24px;
}

.now-playing {
    min-width: 0;
}

.now-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

    font-size: 14px;
    font-weight: 600;
}

.now-sub {
    margin-top: 4px;
    color: #888;
    font-size: 11px;
}

.controls {
    width: 100%;
    max-width: 600px;
    margin: auto;
}

.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
}

.control {
    border: 0;
    background: transparent;
    color: #ddd;

    cursor: pointer;
    font-size: 17px;
}

.control:hover {
    color: #fff;
}

.main-play {
    width: 36px;
    height: 36px;

    border: 0;
    border-radius: 50%;

    background: #fff;
    color: #111;

    cursor: pointer;
    font-size: 15px;
}

.progress-row {
    display: flex;
    align-items: center;
    gap: 8px;

    margin-top: 8px;
}

.time {
    width: 35px;

    color: #888;
    font-size: 10px;

    text-align: center;
}

.progress {
    flex: 1;

    height: 4px;

    accent-color: #fff;
    cursor: pointer;
}

.volume {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
}

.volume-slider {
    width: 100px;
    accent-color: #fff;
}

audio {
    display: none;
}

@media (max-width: 700px) {

    body {
        padding-bottom: 145px;
    }

    header {
        padding: 22px 16px 16px;
    }

    header h1 {
        font-size: 23px;
    }

    main {
        padding: 0 12px 20px;
    }

    .search {
        height: 44px;
    }

    .song {
        padding: 11px 8px;
        gap: 8px;
    }

    .song-number {
        width: 22px;
    }

    .song-title {
        font-size: 14px;
    }

    .download {
        display: none;
    }

    .song-status {
        display: none;
    }

    .player {
        height: 135px;

        display: block;

        padding: 10px 14px;
    }

    .now-playing {
        text-align: center;
    }

    .now-title {
        font-size: 13px;
    }

    .now-sub {
        display: none;
    }

    .controls {
        max-width: none;
    }

    .buttons {
        margin-top: 7px;
        gap: 24px;
    }

    .progress-row {
        margin-top: 7px;
    }

    .volume {
        display: none;
    }
}
</style>

</head>

</div>

<audio id="audio" preload="metadata"></audio>

<script>

const OWNER = "aoaoaoreinn-a11y";
const REPO = "yt";
const RELEASE_TAG = "audio";

const API_URL =
    `https://api.github.com/repos/${OWNER}/${REPO}/releases/tags/${RELEASE_TAG}`;


/* =========================
   IndexedDB
========================= */

const DB_NAME = "MyAudioLibrary";
const DB_VERSION = 1;
const STORE_NAME = "audio";

let dbPromise = null;

function openDatabase() {

    if (dbPromise) {
        return dbPromise;
    }

    dbPromise = new Promise((resolve, reject) => {

        const request =
            indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = event => {

            const db = event.target.result;

            if (!db.objectStoreNames.contains(STORE_NAME)) {

                db.createObjectStore(
                    STORE_NAME,
                    { keyPath: "name" }
                );

            }
        };

        request.onsuccess = () => {
            resolve(request.result);
        };

        request.onerror = () => {
            reject(request.error);
        };

    });

    return dbPromise;
}


async function getCachedAudio(name) {

    const db = await openDatabase();

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(STORE_NAME, "readonly");

        const store =
            transaction.objectStore(STORE_NAME);

        const request =
            store.get(name);

        request.onsuccess = () => {

            resolve(
                request.result || null
            );

        };

        request.onerror = () => {
            reject(request.error);
        };

    });
}


async function saveCachedAudio(song, blob) {

    const db = await openDatabase();

    return new Promise((resolve, reject) => {

        const transaction =
            db.transaction(STORE_NAME, "readwrite");

        const store =
            transaction.objectStore(STORE_NAME);

        store.put({
            name: song.name,
            title: song.title,
            size: song.size,
            type: blob.type || "audio/ogg",
            blob: blob,
            savedAt: Date.now()
        });

        transaction.oncomplete = () => {
            resolve();
        };

        transaction.onerror = () => {
            reject(transaction.error);
        };

        transaction.onabort = () => {
            reject(
                transaction.error ||
                new Error("IndexedDB transaction aborted")
            );
        };

    });
}


/* =========================
   Service Worker
========================= */

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker
            .register("./sw.js")
            .catch(error => {
                console.warn(
                    "Service Worker registration failed:",
                    error
                );
            });

    });

}


/* =========================
   プレイヤー
========================= */

let songs = [];
let currentIndex = -1;

let currentObjectURL = null;

/*
 * 再生処理の世代番号。
 *
 * 曲Aを取得中に曲Bを選択した場合、
 * 曲Aの取得完了後に曲Aを再生してしまう
 * 事故を防ぐ。
 */
let playRequestId = 0;

const audio =
    document.getElementById("audio");

const playButton =
    document.getElementById("play");

const progress =
    document.getElementById("progress");

const currentTime =
    document.getElementById("currentTime");

const duration =
    document.getElementById("duration");

const nowTitle =
    document.getElementById("nowTitle");

const nowSub =
    document.getElementById("nowSub");

const status =
    document.getElementById("status");


/* =========================
   GitHubから取得
========================= */

async function loadSongs() {

    try {

        const response =
            await fetch(API_URL, {
                cache: "no-store"
            });

        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }

        const release =
            await response.json();

        songs =
            release.assets
                .filter(asset =>
                    typeof asset.name === "string" &&
                    asset.name
                        .toLowerCase()
                        .endsWith(".opus")
                )
                .map(asset => ({
                    name: asset.name,
                    title:
                        asset.label ||
                        asset.name,
                    url:
                        asset.browser_download_url,
                    size:
                        Number(asset.size) || 0
                }));

        renderSongs();

        /*
         * Service Workerがある場合、
         * 現在のサイト情報をキャッシュできるようにする。
         */
        if (navigator.serviceWorker) {

            navigator.serviceWorker.ready
                .then(registration => {

                    if (
                        registration.active
                    ) {

                        registration.active.postMessage({
                            type: "CACHE_SONG_LIST"
                        });

                    }

                })
                .catch(() => {});

        }

    } catch (error) {

        console.error(error);

        status.textContent =
            "音声ファイル一覧を取得できませんでした。";

    }

}


/* =========================
   一覧表示
========================= */

function renderSongs() {

    const container =
        document.getElementById("songs");

    const keyword =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();

    container.innerHTML = "";

    const filtered =
        songs.filter(song =>
            song.title
                .toLowerCase()
                .includes(keyword)
        );

    status.textContent =
        `${filtered.length}曲`;

    if (!filtered.length) {

        container.innerHTML = `
            <div class="empty">
                曲が見つかりません。
            </div>
        `;

        return;
    }

    filtered.forEach((song, index) => {

        const realIndex =
            songs.indexOf(song);

        const element =
            document.createElement("div");

        element.className = "song";

        element.innerHTML = `
            <div class="song-number">
                ${index + 1}
            </div>

            <div class="song-info">

                <div class="song-title">
                    ${escapeHtml(song.title)}
                </div>

                <div class="song-size">
                    ${formatSize(song.size)}
                </div>

            </div>

            <div
                class="song-status"
                data-cache-name="${escapeAttribute(song.name)}"
            >
                確認中
            </div>

            <a
                class="download"
                href="${escapeAttribute(song.url)}"
                download
                title="ダウンロード"
                onclick="event.stopPropagation()"
            >
                ↓
            </a>

            <button
                class="play-button"
                title="再生"
                aria-label="再生"
            >
                ▶
            </button>
        `;

        const button =
            element.querySelector(".play-button");

        button.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                playSong(realIndex);

            }
        );

        element.addEventListener(
            "click",
            () => playSong(realIndex)
        );

        container.appendChild(element);

        /*
         * 保存済みか確認。
         * 一覧表示をブロックしないよう非同期で行う。
         */
        updateCacheStatus(song, element);

    });

}


async function updateCacheStatus(song, element) {

    try {

        const cached =
            await getCachedAudio(song.name);

        if (!element.isConnected) {
            return;
        }

        const statusElement =
            element.querySelector(".song-status");

        if (!statusElement) {
            return;
        }

        statusElement.textContent =
            cached
                ? "保存済み"
                : "";

    } catch (error) {

        console.warn(
            "Cache status error:",
            error
        );

    }

}


/* =========================
   曲を再生
========================= */

async function playSong(index) {

    if (!songs[index]) {
        return;
    }

    const requestId =
        ++playRequestId;

    currentIndex = index;

    const song =
        songs[index];

    nowTitle.textContent =
        song.title;

    nowSub.textContent =
        "読み込み中...";

    playButton.textContent =
        "Ⅱ";

    /*
     * 現在のaudioを停止。
     */
    audio.pause();

    /*
     * 以前のObject URLを破棄。
     */
    revokeCurrentObjectURL();

    /*
     * 再生位置をリセット。
     */
    audio.removeAttribute("src");
    audio.load();

    try {

        /*
         * =================================
         * ① IndexedDBを確認
         * =================================
         */

        const cached =
            await getCachedAudio(song.name);

        /*
         * 別の曲が選択されていたら、
         * この処理はここで終了。
         */
        if (requestId !== playRequestId) {
            return;
        }

        if (cached && cached.blob) {

            /*
             * =================================
             * ② 保存済み → IndexedDBから再生
             * =================================
             */

            nowSub.textContent =
                "オフライン保存";

            await playBlob(
                cached.blob,
                requestId
            );

            return;
        }


        /*
         * =================================
         * ③ 未保存 → GitHubから取得
         * =================================
         */

        nowSub.textContent =
            "ダウンロード中...";

        const response =
            await fetch(song.url);

        if (!response.ok) {

            throw new Error(
                `音声取得失敗: HTTP ${response.status}`
            );

        }

        const blob =
            await response.blob();

        /*
         * 別の曲が選択されていたら、
         * 古い曲を保存しない。
         */
        if (requestId !== playRequestId) {
            return;
        }

        if (!blob || blob.size === 0) {

            throw new Error(
                "空の音声ファイルです。"
            );

        }

        /*
         * =================================
         * ④ IndexedDBに保存
         * =================================
         */

        try {

            await saveCachedAudio(
                song,
                blob
            );

        } catch (cacheError) {

            /*
             * キャッシュ保存に失敗しても、
             * 音声自体は再生できるようにする。
             */
            console.warn(
                "IndexedDB保存失敗:",
                cacheError
            );

        }

        if (requestId !== playRequestId) {
            return;
        }

        nowSub.textContent =
            "保存済み";

        /*
         * =================================
         * ⑤ 今回取得したBlobを再生
         * =================================
         */

        await playBlob(
            blob,
            requestId
        );

        /*
         * 一覧の表示も更新。
         */
        renderSongs();

    } catch (error) {

        console.error(error);

        /*
         * ネットワーク取得に失敗した場合でも、
         * 念のためIndexedDBをもう一度確認。
         *
         * 例えば通信途中でエラーになった場合などに
         * 保存済みデータがあれば再生できる。
         */
        try {

            const cached =
                await getCachedAudio(song.name);

            if (
                requestId === playRequestId &&
                cached &&
                cached.blob
            ) {

                nowSub.textContent =
                    "オフライン保存";

                await playBlob(
                    cached.blob,
                    requestId
                );

                return;
            }

        } catch (fallbackError) {

            console.error(
                fallbackError
            );

        }

        if (requestId === playRequestId) {

            nowSub.textContent =
                "再生できませんでした";

            playButton.textContent =
                "▶";

            alert(
                "この曲を取得できませんでした。\n" +
                "初回再生にはインターネット接続が必要です。"
            );

        }

    }

}


/* =========================
   Blobを再生
========================= */

async function playBlob(blob, requestId) {

    if (requestId !== playRequestId) {
        return;
    }

    revokeCurrentObjectURL();

    currentObjectURL =
        URL.createObjectURL(blob);

    audio.src =
        currentObjectURL;

    audio.load();

    /*
     * ブラウザの再生準備を待つ。
     */
    await audio.play();

    if (requestId !== playRequestId) {

        audio.pause();

        return;
    }

}


/* =========================
   Object URL解放
========================= */

function revokeCurrentObjectURL() {

    if (currentObjectURL) {

        URL.revokeObjectURL(
            currentObjectURL
        );

        currentObjectURL = null;

    }

}


/* =========================
   再生 / 一時停止
========================= */

playButton.addEventListener(
    "click",
    async () => {

        if (currentIndex === -1) {

            if (songs.length) {
                await playSong(0);
            }

            return;
        }

        if (audio.paused) {

            try {

                await audio.play();

            } catch (error) {

                console.error(error);

                playButton.textContent =
                    "▶";

            }

        } else {

            audio.pause();

        }

    }
);


audio.addEventListener(
    "play",
    () => {

        playButton.textContent =
            "Ⅱ";

    }
);


audio.addEventListener(
    "pause",
    () => {

        playButton.textContent =
            "▶";

    }
);


/* =========================
   前の曲
========================= */

document
    .getElementById("prev")
    .addEventListener(
        "click",
        () => {

            if (!songs.length) {
                return;
            }

            const index =
                currentIndex <= 0
                    ? songs.length - 1
                    : currentIndex - 1;

            playSong(index);

        }
    );


/* =========================
   次の曲
========================= */

document
    .getElementById("next")
    .addEventListener(
        "click",
        () => {

            if (!songs.length) {
                return;
            }

            const index =
                currentIndex >= songs.length - 1
                    ? 0
                    : currentIndex + 1;

            playSong(index);

        }
    );


/* =========================
   自動で次の曲
========================= */

audio.addEventListener(
    "ended",
    () => {

        if (!songs.length) {
            return;
        }

        const next =
            currentIndex >= songs.length - 1
                ? 0
                : currentIndex + 1;

        playSong(next);

    }
);


/* =========================
   シークバー
========================= */

audio.addEventListener(
    "loadedmetadata",
    () => {

        duration.textContent =
            formatTime(audio.duration);

        progress.value = 0;

    }
);


audio.addEventListener(
    "timeupdate",
    () => {

        if (!Number.isFinite(audio.duration)) {
            return;
        }

        if (audio.duration <= 0) {
            return;
        }

        progress.value =
            (
                audio.currentTime /
                audio.duration
            ) * 100;

        currentTime.textContent =
            formatTime(audio.currentTime);

    }
);


progress.addEventListener(
    "input",
    () => {

        if (!Number.isFinite(audio.duration)) {
            return;
        }

        audio.currentTime =
            (
                Number(progress.value) /
                100
            ) * audio.duration;

    }
);


/* =========================
   音量
========================= */

document
    .getElementById("volume")
    .addEventListener(
        "input",
        event => {

            audio.volume =
                Number(event.target.value);

        }
    );


/* =========================
   検索
========================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        renderSongs
    );


/* =========================
   時間
========================= */

function formatTime(seconds) {

    if (!Number.isFinite(seconds)) {
        return "0:00";
    }

    const min =
        Math.floor(seconds / 60);

    const sec =
        Math.floor(seconds % 60)
            .toString()
            .padStart(2, "0");

    return `${min}:${sec}`;

}


/* =========================
   ファイルサイズ
========================= */

function formatSize(bytes) {

    if (bytes < 1024) {
        return `${bytes} B`;
    }

    if (bytes < 1024 * 1024) {

        return `${(
            bytes / 1024
        ).toFixed(1)} KB`;

    }

    return `${(
        bytes /
        1024 /
        1024
    ).toFixed(2)} MB`;

}


/* =========================
   HTMLエスケープ
========================= */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        String(text);

    return div.innerHTML;

}


function escapeAttribute(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}


/* =========================
   終了時
========================= */

window.addEventListener(
    "beforeunload",
    () => {

        revokeCurrentObjectURL();

    }
);


/* =========================
   起動
========================= */

loadSongs();

</script>
